name: Build and Deploy Jekyll Site

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4
    
    - name: Restore relative paths to ensure clean state
      run: |
        echo "Restoring relative paths to ensure clean state..."
        chmod +x ./restore_assets.sh
        ./restore_assets.sh
    
    - name: Copy assets from _articles to main assets directory
      run: |
        if [ -d "_articles/assets" ]; then
          echo "Copying assets from _articles/assets to assets/"
          mkdir -p assets
          cp -r _articles/assets/* assets/
        fi
    
    - name: Convert relative asset paths to absolute URLs
      run: |
        echo "Converting relative asset paths to absolute URLs..."
        chmod +x ./convert_assets.sh
        ./convert_assets.sh
    
    - name: Build Jekyll site
      run: |
        bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
